<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%" style="background-color: #1e1e1e; font-family: sans-serif;">
  <!-- Title -->
  <text x="450" y="40" fill="#ff4d4d" font-size="24" font-weight="bold" text-anchor="middle">MODULAR SHELF SYSTEM - DANGEROUS DESIGN FLAWS</text>
  <text x="450" y="65" fill="#aaaaaa" font-size="14" text-anchor="middle">Structural &amp; Geometric Analysis | Humid Tropical Environment (Kalimantan)</text>

  <!-- FLAW 1: SHARED BOLT COLLAPSE HAZARD -->
  <g transform="translate(50, 100)">
    <!-- Background Box -->
    <rect width="380" height="240" rx="8" fill="#2d2d2d" stroke="#ff4d4d" stroke-width="2"/>
    <text x="190" y="30" fill="#ff4d4d" font-size="16" font-weight="bold" text-anchor="middle">1. Shared Inner Column Bolt Hazard</text>
    
    <!-- Column -->
    <rect x="170" y="60" width="40" height="130" fill="#8b5a2b" stroke="#3e2723" stroke-width="2"/>
    <text x="190" y="125" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(-90 190 125)">COLUMN B (4x6)</text>
    
    <!-- Bay 1 Shelf Bracket (Left) -->
    <rect x="70" y="100" width="100" height="15" fill="#4caf50" rx="3"/>
    <text x="120" y="111" fill="#ffffff" font-size="10" text-anchor="middle">Bay 1 Shelf (OK)</text>
    
    <!-- Bay 2 Shelf Bracket (Right) - DROPPING/COLLAPSING -->
    <g transform="translate(0, 30)">
      <rect x="210" y="70" width="100" height="15" fill="#f44336" rx="3" transform="rotate(15 210 70)"/>
      <text x="260" y="85" fill="#ffffff" font-size="10" text-anchor="middle" transform="rotate(15 210 70)">Bay 2 Shelf (COLLAPSING!)</text>
      <!-- Motion Arrows -->
      <path d="M 280 110 L 280 140 M 280 140 L 275 133 M 280 140 L 285 133" stroke="#f44336" stroke-width="2" fill="none"/>
    </g>

    <!-- Bolt being withdrawn -->
    <g transform="translate(-10, 0)">
      <!-- Bolt Shaft -->
      <rect x="100" y="104" width="120" height="6" fill="#b0bec5"/>
      <!-- Bolt Head -->
      <rect x="90" y="99" width="10" height="16" fill="#78909c" rx="2"/>
      <!-- Nut and Washer on the right (falling off) -->
      <circle cx="235" cy="107" r="8" fill="#78909c" opacity="0.5"/>
      <rect x="232" y="99" width="6" height="16" fill="#546e7a" rx="1"/>
      <!-- Withdrawal Arrow -->
      <path d="M 120 85 L 80 85 M 80 85 L 87 81 M 80 85 L 87 89" stroke="#ffeb3b" stroke-width="2" fill="none"/>
      <text x="100" y="75" fill="#ffeb3b" font-size="10" text-anchor="middle" font-weight="bold">Bolt Withdrawn</text>
    </g>

    <text x="190" y="215" fill="#dddddd" font-size="11" text-anchor="middle">Adjusting Bay 1 releases the bolt, causing the loaded</text>
    <text x="190" y="230" fill="#ff4d4d" font-size="11" font-weight="bold" text-anchor="middle">Bay 2 shelf to lose support and collapse!</text>
  </g>

  <!-- FLAW 2: GEOMETRIC INTERFERENCE / COLLISION -->
  <g transform="translate(470, 100)">
    <!-- Background Box -->
    <rect width="380" height="240" rx="8" fill="#2d2d2d" stroke="#ff4d4d" stroke-width="2"/>
    <text x="190" y="30" fill="#ff4d4d" font-size="16" font-weight="bold" text-anchor="middle">2. Drawer &amp; Bolt Collision (Top View)</text>

    <!-- Left Column Section -->
    <rect x="40" y="70" width="40" height="60" fill="#8b5a2b" stroke="#3e2723" stroke-width="2"/>
    <text x="60" y="105" fill="#ffffff" font-size="10" text-anchor="middle">Col A</text>

    <!-- Right Column Section -->
    <rect x="300" y="70" width="40" height="60" fill="#8b5a2b" stroke="#3e2723" stroke-width="2"/>
    <text x="320" y="105" fill="#ffffff" font-size="10" text-anchor="middle">Col B</text>

    <!-- Bolt 1 (Left) -->
    <rect x="25" y="97" width="70" height="6" fill="#b0bec5"/>
    <rect x="20" y="92" width="5" height="16" fill="#78909c" rx="1"/>
    <rect x="90" y="92" width="6" height="16" fill="#546e7a" rx="1"/>
    <!-- Nut protrusion text -->
    <text x="125" y="85" fill="#ff4d4d" font-size="10" font-weight="bold">Nut Protrudes 1.5 cm</text>
    <path d="M 93 92 L 105 85" stroke="#ff4d4d" stroke-width="1"/>

    <!-- 80 cm Clear Span dimension -->
    <path d="M 80 55 L 300 55" stroke="#2196f3" stroke-width="1.5"/>
    <path d="M 80 50 L 80 60 M 300 50 L 300 60" stroke="#2196f3" stroke-width="1.5"/>
    <text x="190" y="48" fill="#2196f3" font-size="11" font-weight="bold" text-anchor="middle">80 cm Clear Bay Width</text>

    <!-- 80 cm Drawer Box (Colliding) -->
    <rect x="80" y="115" width="220" height="70" fill="#ffe082" stroke="#ffb300" stroke-width="2" fill-opacity="0.8"/>
    <text x="190" y="155" fill="#3e2723" font-size="13" font-weight="bold" text-anchor="middle">Drawer Box (80 cm wide)</text>

    <!-- Collision Points -->
    <circle cx="93" cy="115" r="8" fill="none" stroke="#f44336" stroke-width="2"/>
    <path d="M 85 107 L 101 123 M 101 107 L 85 123" stroke="#f44336" stroke-width="2"/>
    
    <circle cx="297" cy="115" r="8" fill="none" stroke="#f44336" stroke-width="2"/>
    <path d="M 289 107 L 305 123 M 305 107 L 289 123" stroke="#f44336" stroke-width="2"/>

    <text x="190" y="215" fill="#dddddd" font-size="11" text-anchor="middle">Carpenter-ordered drawer (80 cm) is physically wider</text>
    <text x="190" y="230" fill="#ff4d4d" font-size="11" font-weight="bold" text-anchor="middle">than the space between protruding nuts (~77 cm)!</text>
  </g>

  <!-- FLAW 3: UNBRACED FRONT CANTILEVER DEFLECTION -->
  <g transform="translate(50, 360)">
    <!-- Background Box -->
    <rect width="800" height="240" rx="8" fill="#2d2d2d" stroke="#ff9800" stroke-width="2"/>
    <text x="400" y="25" fill="#ff9800" font-size="16" font-weight="bold" text-anchor="middle">3. Front Column Unbraced Cantilever Deflection (X-Z Plane)</text>

    <!-- Floor -->
    <rect x="40" y="200" width="720" height="15" fill="#424242"/>
    <text x="400" y="212" fill="#ffffff" font-size="10" text-anchor="middle">WOOD FLOOR</text>

    <!-- Wall Anchor at Back (Reference) -->
    <line x1="720" y1="50" x2="720" y2="200" stroke="#757575" stroke-dasharray="5,5" stroke-width="2"/>
    <text x="730" y="120" fill="#757575" font-size="10" transform="rotate(-90 730 120)" text-anchor="middle">Wall Anchor Line (Back Only)</text>

    <!-- Front Rail (Z = 36-40) -->
    <rect x="100" y="160" width="40" height="15" fill="#a1887f" stroke="#4e342e"/>
    <text x="120" y="171" fill="#ffffff" font-size="8" text-anchor="middle">RAIL</text>
    <text x="65" y="170" fill="#aaaaaa" font-size="9">Z = 40 cm</text>

    <!-- Undeflected Column (Ghost) -->
    <rect x="112" y="50" width="16" height="150" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-dasharray="2,2" stroke-opacity="0.3"/>

    <!-- Deflected Column Curve -->
    <!-- Column bends from Z=40 to Z=200 -->
    <!-- Path: start at base (120, 200), straight to rail (120, 160), then curve to (180, 50) -->
    <path d="M 120 200 L 120 160 Q 120 110 160 50" fill="none" stroke="#ff9800" stroke-width="12" stroke-linecap="round"/>
    <!-- Highlight column grain -->
    <path d="M 120 200 L 120 160 Q 120 110 160 50" fill="none" stroke="#e65100" stroke-width="2" stroke-dasharray="8,4" stroke-linecap="round"/>

    <!-- L-bracket at Floor -->
    <path d="M 110 200 L 110 190 L 120 190" fill="none" stroke="#b0bec5" stroke-width="3"/>
    
    <!-- Human Lateral Load (250 N / 25 kg) -->
    <path d="M 230 50 L 180 50" stroke="#f44336" stroke-width="3" fill="none"/>
    <path d="M 180 50 L 187 45 M 180 50 L 187 55" stroke="#f44336" stroke-width="3" fill="none"/>
    <text x="285" y="45" fill="#f44336" font-size="11" font-weight="bold">Human Impact Load: 250 N (25 kgf)</text>
    <text x="285" y="58" fill="#aaaaaa" font-size="9">(Slip, fall, or grab for balance)</text>

    <!-- Deflection Dimension -->
    <path d="M 120 38 L 160 38" stroke="#ffeb3b" stroke-width="1.5"/>
    <path d="M 120 34 L 120 42 M 160 34 L 160 42" stroke="#ffeb3b" stroke-width="1.5"/>
    <text x="140" y="30" fill="#ffeb3b" font-size="11" font-weight="bold" text-anchor="middle">δ ≈ 11.8 cm</text>

    <!-- Technical Details -->
    <rect x="420" y="80" width="350" height="105" fill="#1e1e1e" stroke="#424242" rx="4"/>
    <text x="430" y="98" fill="#ffffff" font-size="11" font-weight="bold">Mechanical Stress Analysis:</text>
    <text x="430" y="118" fill="#dddddd" font-size="10">• Unbraced Length (L) = 160 cm above front rail</text>
    <text x="430" y="133" fill="#dddddd" font-size="10">• Column Weak Axis = 4 cm (X-direction)</text>
    <text x="430" y="148" fill="#dddddd" font-size="10">• Bending Stress (σ) = 25.0 MPa (under 250 N pull)</text>
    <text x="430" y="163" fill="#ff9800" font-size="10" font-weight="bold">• Wet MOR (Meranti) = 42.0 MPa | SAFETY FACTOR = 1.68x (Dangerous!)</text>
  </g>
</svg>
